; The app validates uploaded files up to 20MB (see App\Http\Requests\FileRequest),
; but PHP's own defaults (upload_max_filesize=2M, post_max_size=8M) are smaller
; and would silently drop/truncate the upload before Laravel ever sees it.
; These overrides bring PHP's limits in line with what the app actually allows.
upload_max_filesize = 1024M
post_max_size = 2048M
